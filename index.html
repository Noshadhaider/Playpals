  ground.rotation.x=-Math.PI/2;scene.add(ground);
  var tsh=new THREE.Shape();tsh.moveTo(RCP[0].x,RCP[0].z);RCP.forEach(function(p){tsh.lineTo(p.x,p.z)});tsh.closePath();
  var track=new THREE.Mesh(new THREE.ShapeGeometry(tsh),new THREE.MeshStandardMaterial({color:0x2a2a2a}));
  track.rotation.x=-Math.PI/2;track.position.y=0.02;scene.add(track);
  RCP.forEach(function(p,i){
    var ring=new THREE.Mesh(new THREE.TorusGeometry(6,0.4,8,20),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x333333}));
    ring.position.set(p.x,2.2,p.z);scene.add(ring);
    for(var k=-1;k<=1;k+=2){var cone=new THREE.Mesh(new THREE.ConeGeometry(0.8,2,8),new THREE.MeshStandardMaterial({color:i%2?0xffd500:0xff4b3a}));
      cone.position.set(p.x+k*8,1,p.z+k*2);scene.add(cone)}});
  var ps=players();RC.cars=[];RC.oil=[];
  ps.forEach(function(p,idx){
    var ci=(G.picks&&G.picks[p.id]!==undefined)?G.picks[p.id]:0,c=RCARDS[ci]||RCARDS[0];
    var mesh=makeRaceCar(c.color);scene.add(mesh);var start=RCP[0];
    RC.cars.push({pid:p.id,name:p.name,card:c,mesh:mesh,isPlayer:p.id===myId,
      x:start.x+idx*3-ps.length*1.5,z:start.z+idx*2,ang:0,cp:0,laps:0,
      speed:0.34*c.speed,abCd:0,frozen:0,oiled:0,shielded:0,boosted:0,finished:false})});
  RC.scene=scene;RC.camera=camera;RC.renderer=renderer;RC.startPerf=performance.now();
  RWHEEL=0;RKEYS={};RDONE=0}
function raceSpeedMul(car){var m=1;if(car.boosted>0)m*=1.6;if(car.frozen>0)m*=0.05;if(car.oiled>0)m*=0.4;return m}
function raceDropOil(car){RC.oil.push({x:car.x,z:car.z,t:9,owner:car})}
function raceDoAbility(car,ai){
  var ab=car.card.ab.key;car.abCd=ab==="nitro"?8:ab==="oil"?10:ab==="emp"?12:14;
  if(ab==="nitro")car.boosted=3;if(ab==="oil")raceDropOil(car);if(ab==="shield")car.shielded=4;
  if(ab==="emp"){var best=null,bd=ai?16:18;RC.cars.forEach(function(o){if(o===car||o.finished)return;var dx=o.x-car.x,dz=o.z-car.z,d=Math.sqrt(dx*dx+dz*dz);
    var fwd=Math.sin(car.ang)*dx+Math.cos(car.ang)*dz;if(d<bd&&fwd>0){bd=d;best=o}});if(best&&best.shielded<=0)best.frozen=2}}
function raceUseAbility(){var car=RC.cars.filter(function(c){return c.isPlayer})[0];if(!car||car.abCd>0||car.finished)return;raceDoAbility(car,false)}
function raceStepCar(car,dt){
  if(car.finished)return;var turn=0;
  if(car.isPlayer)turn=RWHEEL;
  else{var want=Math.atan2(RCP[car.cp].x-car.x,RCP[car.cp].z-car.z),diff=Math.atan2(Math.sin(want-car.ang),Math.cos(want-car.ang));
    turn=Math.max(-1,Math.min(1,diff*2.2));
    if(car.abCd<=0&&Math.random()<0.01)raceDoAbility(car,true)}
  car.ang+=turn*1.8*dt;
  var sp=car.speed*raceSpeedMul(car)*(car.isPlayer?(RKEYS.G?1.3:(RKEYS.B?0.35:0.75)):1);
  car.x+=Math.sin(car.ang)*sp*60*dt;car.z+=Math.cos(car.ang)*sp*60*dt;
  car.mesh.position.set(car.x,0,car.z);car.mesh.rotation.y=car.ang;
  car.abCd=Math.max(0,car.abCd-dt);car.frozen=Math.max(0,car.frozen-dt);car.oiled=Math.max(0,car.oiled-dt);
  car.shielded=Math.max(0,car.shielded-dt);car.boosted=Math.max(0,car.boosted-dt);
  if(Math.hypot(RCP[car.cp].x-car.x,RCP[car.cp].z-car.z)<9){car.cp++;if(car.cp>=RCP.length){car.cp=0;car.laps++;
    if(car.laps>=3&&!car.finished){car.finished=true;
      if(car.isPlayer&&RDONE!==G.rid){RDONE=G.rid;var ms=Math.round(performance.now()-RC.startPerf);act({t:"finish",v:ms});render()}}}}
  RC.oil.forEach(function(o){if(o.owner===car&&o.t>7)return;var dx=car.x-o.x,dz=car.z-o.z;
    if(Math.sqrt(dx*dx+dz*dz)<3&&car.shielded<=0&&o.t>0){car.oiled=2;o.t=0}})}
function raceLoop(ts){
  if(!$("#rch")||!G||G.game!=="race"||G.stage!=="race"){RC.running=false;return}
  var dt=Math.min(0.05,(ts-(raceLoop._t||ts))/1000);raceLoop._t=ts;
  if(Date.now()>=G.raceStart)RC.cars.forEach(function(c){raceStepCar(c,dt)});
  RC.oil.forEach(function(o){o.t-=dt});RC.oil=RC.oil.filter(function(o){return o.t>-3});
  var p=RC.cars.filter(function(c){return c.isPlayer})[0];
  if(p&&RC.camera){var bx=-Math.sin(p.ang)*9,bz=-Math.cos(p.ang)*9;
    RC.camera.position.set(p.x+bx,4.5,p.z+bz);RC.camera.lookAt(p.x,1,p.z);
    var lp=$("#rcLap");if(lp)lp.textContent=(Date.now()<G.raceStart?"Get Ready…":"Lap "+Math.min(p.laps+1,3)+"/3");
    var ab=$("#rcAb");if(ab){ab.disabled=p.abCd>0;ab.textContent=p.card.ab.icon+(p.abCd>0?" "+Math.ceil(p.abCd):"")}}
  if(RC.renderer&&RC.scene&&RC.camera)RC.renderer.render(RC.scene,RC.camera);
  requestAnimationFrame(raceLoop)}
function vRace(){return G.stage==="pick"?vRacePick():G.stage==="race"?vRaceRun():vRaceResult()}
function vRacePick(){
  var n=Object.keys(G.picks||{}).length,tot=players().length;
  var myPick=(G.picks&&G.picks[myId]!==undefined)?G.picks[myId]:(RPICK===G.rid?RPICKI:undefined);
  return'<div class="top"><span class="mut">Apni car chuno</span><span class="tm" id="tm">…</span></div>'+
    '<div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">'+RCARDS.map(function(c,i){
      return'<div class="g" style="background:'+c.hex+';flex-direction:column;align-items:flex-start;'+(myPick===i?'outline:3px solid #fff':'')+'" onclick="racePick('+i+')"><span class="e">'+c.em+'</span><b>'+c.name+'</b><small>'+c.ab.icon+' '+c.ab.name+' — '+c.ab.desc+'</small></div>'
    }).join('')+'</div>'+
    (myPick!==undefined?'<div class="ok">✅ '+RCARDS[myPick].name+' select ki. Baaki ka wait… ('+n+'/'+tot+')</div>':'<p class="mut" style="text-align:center">Card choose karte hi race shuru hone ka wait hoga</p>')}
function vRaceRun(){
  return'<div class="rc-wrap"><div id="rch"></div>'+
    '<div class="rc-hud"><div class="rc-pill" id="rcLap">Lap 1/3</div><div class="rc-pill" id="tm">…</div></div>'+
    '<div class="rc-ctl"><div class="rc-wheelwrap"><div class="rc-wheel" id="rcWheel"></div></div>'+
    '<div class="rc-right"><button class="rc-ab" id="rcAb" onclick="raceUseAbility()">⚡</button>'+
    '<div class="rc-pedals"><button class="rc-pedal brake" ontouchstart="rkd(\'B\')" ontouchend="rku(\'B\')" onmousedown="rkd(\'B\')" onmouseup="rku(\'B\')" oncontextmenu="return false">🛑</button>'+
    '<button class="rc-pedal gas" ontouchstart="rkd(\'G\')" ontouchend="rku(\'G\')" onmousedown="rkd(\'G\')" onmouseup="rku(\'G\')" oncontextmenu="return false">⛽</button></div></div></div>'+
    (RDONE===G.rid?'<div class="ok">✅ Aapki race khatam! Baaki players ka wait…</div>':'<p class="mut" style="text-align:center">Ghuma kar steer karo, pedal daba ke gas/brake, ⚡ se ability use karo</p>')}
function vRaceResult(){
  var ranked=players().slice().sort(function(a,b){
    var ta=(G.times||{})[a.id],tb=(G.times||{})[b.id],da=(ta===null||ta===undefined),db2=(tb===null||tb===undefined);
    if(da&&db2)return 0;if(da)return 1;if(db2)return -1;return ta-tb});
  var h='<h1>🏁 Race Result</h1><div class="card">'+ranked.map(function(p,i){var t=(G.times||{})[p.id];
    return'<div class="pl"><span class="e">'+av(p,24)+'</span><b>'+(i+1)+'. '+esc(p.name)+'</b><span class="mut">'+(t===null||t===undefined?'DNF':(t/1000).toFixed(1)+'s')+'</span></div>'}).join('')+'</div>';
  h+='<h2>Total points</h2>'+scores();
  h+=(isHost?'<button class="btn" onclick="startRace()">🔁 Next race (nayi track)</button><br>':'<p class="mut" style="text-align:center">Host agli race shuru karega…</p>');
  h+='<button class="btn alt" onclick="leave()">Home</button>';
  return h}
function render(){
  var app=$("#app"),gi=$("#gi"),v=gi?gi.value:"",f=gi&&document.activeElement===gi,h;
  if(!me)h=vLogin();
  else if(!room)h=tab==="fr"?vFriends():tab==="me"?vMe():vHome();
  else if(!G||G.phase==="lobby")h=vLobby();
  else if(G.phase==="end")h=vEnd();
  else{h='<div class="top"><button class="btn sm alt" onclick="leave()">✕</button><span>'+GAMES[G.game].e+' '+GAMES[G.game].n+'</span><span></span></div>'+(G.game==="draw"?vDraw():G.game==="wyr"?vWyr():G.game==="chain"?vChain():G.game==="who"?vWho():G.game==="battle"?vBattle():G.game==="race"?vRace():vEmoji())}
  if(me)h+=popups();
  app.innerHTML=h;
  var ch=$("#cvh");if(ch){ensureCv();ch.appendChild(cv);if(G.round!==lastRound){strokes=[];cx.clearRect(0,0,600,600);lastRound=G.round}}
  var bh=$("#bch");if(bh){ensureB();bh.appendChild(bcv);if(BS.crid!==G.rid){bStrokes=[];bcx.clearRect(0,0,600,600);BS.crid=G.rid}}
  var rh=$("#rch");
  if(rh){ensureRaceCanvas();rh.appendChild(RCV);if(RC.rid!==G.rid){initRaceScene();RC.rid=G.rid}
    var rcw=RCV.clientWidth||300,rch2=RCV.clientHeight||300;
    if(RC.renderer){RC.renderer.setSize(rcw,rch2,false);if(RC.camera){RC.camera.aspect=rcw/rch2;RC.camera.updateProjectionMatrix()}}
    if(!RC.running){RC.running=true;requestAnimationFrame(raceLoop)}}
  var rw=$("#rcWheel");
  if(rw&&rw!==RWHEELEL){RWHEELEL=rw;
    rw.addEventListener('touchstart',rwStart,{passive:false});rw.addEventListener('touchmove',rwMove,{passive:false});
    rw.addEventListener('touchend',rwEnd);rw.addEventListener('mousedown',rwStart);
    if(!RWBound){RWBound=1;window.addEventListener('mousemove',rwMove);window.addEventListener('mouseup',rwEnd)}}
  if(G&&G.phase==="lobby")lastRound=-9;
  var ni=$("#gi");if(ni){ni.value=v;if(f)ni.focus()}sync()}
if("serviceWorker"in navigator&&location.protocol.indexOf("http")===0)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
setInterval(function(){var ch=0,n=Date.now(),k;
  for(k in sentInv)if(n-sentInv[k].t>INV_MS){var s0=sentInv[k];try{if(invW[k]){invW[k].ref.off("value",invW[k].f);delete invW[k]}db.ref("pp/invites/"+k+"/"+s0.c).remove()}catch(e){}delete sentInv[k];missed[k]=1;ch=1}
  for(k in invs)if(invAt[k]&&n-invAt[k].at>INV_MS&&invs[k]){delete invs[k];dropInv(k);ch=1}
  if(ch)render();else tickCd()},1000);
window.addEventListener("hashchange",function(){var h=location.hash.replace("#","").toUpperCase();if(!me||h.length!==4||h===code)return;if(room&&isHost&&!confirm("Apna room band karke naye room me jana hai?"))return;connect(h,false)});
authInit();if(db)render();
